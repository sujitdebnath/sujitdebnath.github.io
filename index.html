    <!-- Decodes the redirect from 404.html back into a real path before
         React Router mounts. Pairs with public/404.html. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>

    <!-- Theme flash prevention: set the class before React mounts.
         Light is the default for first-time visitors; only an explicit
         stored preference (from a previous manual toggle) starts dark. -->
    <script>
      (function () {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
